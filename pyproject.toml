[project]
name = "wings"
version = "1.0.0"
description = "Segmentation of bee wing images"
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
  { name = "Mateusz Krajewski" }
]

dependencies = [
    "gradio>=6.1.0",
    "lightning>=2.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "opencv-python>=4.12.0.88",
    "pip>=25.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "typer>=0.12.5",
    "tqdm>=4.67.1",
    "ultralytics>=8.4.41",
    "wandb>=0.26.1",
    "python-dotenv>=1.2.2",
    "ipywidgets>=8.1.8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.setuptools.packages.find]
include = ["wings"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.0",
    "pytest-benchmark>=5.2.3",
]
# Only for notebooks/28_deepwings_live_query.ipynb (querying DeepWings' live
# website, which speaks the older Socket.IO v2/Engine.IO v3 protocol -- not
# needed for training/production code). Not installed by a plain `uv sync`
# (unlike `dev`, which is default-included) -- opt in with
# `uv sync --group deepwings` when running that notebook.
deepwings = [
    "python-socketio==4.6.1",
    "python-engineio==3.14.2",
]
